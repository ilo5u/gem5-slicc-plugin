inlay.parameters.name=Parameter names
inlay.parameters.description=Show parameter names at resolved SLICC function calls. Hide names that are ambiguous or already match the argument.
inlay.types.name=Implicit variable types
inlay.types.description=Show inferred types at the first use of in_msg, out_msg, tbe, cache_entry, and address within each implicit binding. Explicit variable declarations are not repeated.
